<style>
  /* Jeden soubor bez závislostí: server posílá COEP require-corp, takže žádné externí písmo, obrázek ani skript. */
  :root { --bg: #0b0e16; --panel: #151a26; --text: #e8e6df; --muted: #9c9a92; --accent: #d9a441; --accent2: #f0c76a; --accent-ink: #1a1408;
          --line: #283044; --ok: #6fcf8e; --bad: #ff7a6b; --warn: #e9b44c;
          --art: radial-gradient(900px 520px at 82% -8%, rgba(111,180,232,.24), transparent 62%), radial-gradient(760px 520px at 8% 0%, rgba(217,164,65,.16), transparent 60%),
                 repeating-linear-gradient(115deg, rgba(255,255,255,.016) 0 2px, transparent 2px 16px); }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; position: relative; overflow-x: hidden; }
  .bg { position: fixed; inset: 0; z-index: 0; background: var(--art); pointer-events: none; }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 40%, var(--bg) 100%); }
  main, .top, footer { position: relative; z-index: 1; width: 100%; max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:hover { color: var(--accent2); }
  button, select, input { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 18px; padding-bottom: 6px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .02em; color: var(--muted); font-size: 14px; }
  .brand svg { width: 28px; height: 28px; color: var(--accent); }
  .top-end { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px;
          background: color-mix(in srgb, var(--panel) 80%, transparent); color: var(--text); font-size: 14px; text-decoration: none; cursor: pointer; backdrop-filter: blur(6px); }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip svg { width: 16px; height: 16px; fill: currentColor; }

  .hero { padding: 7vh 0 22px; }
  .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  h1 { margin: 0 0 12px; font-size: clamp(30px, 6.2vw, 56px); line-height: 1.05; letter-spacing: -.01em; font-weight: 800; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--accent); }
  .lead { margin: 0; max-width: 56ch; color: var(--muted); font-size: clamp(16px, 2.2vw, 19px); }

  .card { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 22px; backdrop-filter: blur(8px); }
  .play { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 8px; }
  @media (max-width: 760px) { .play { grid-template-columns: 1fr; } }
  h2 { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  label { display: block; font-size: 14px; margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  input[type=text], select { width: 100%; padding: 11px 12px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font-size: 16px; }
  input[type=text]:focus-visible, select:focus-visible { outline-offset: 1px; border-color: var(--accent); }
  .hint { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .err { margin: 8px 0 0; font-size: 14px; color: var(--bad); min-height: 1.4em; }
  .go { width: 100%; margin-top: 4px; padding: 14px; font-size: 18px; font-weight: 800; letter-spacing: .02em; color: var(--accent-ink);
        background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; transition: transform .12s, filter .12s, box-shadow .12s;
        box-shadow: 0 6px 24px -8px var(--accent); }
  .go:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .go:active { transform: none; }
  .go:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }
  .linklike { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 13px; }

  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .checks li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: 15px; }
  .checks .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--line); color: var(--muted); }
  .checks .ok .ic { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
  .checks .bad .ic { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad); }
  .checks .warn .ic { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
  .checks small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .srv { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: grid; gap: 3px; }
  .srv b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--bad); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 14px 0 0; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .grid .card { padding: 18px; }
  .grid ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14.5px; }
  .grid li { margin-bottom: 5px; }
  .grid p { margin: 0 0 12px; color: var(--muted); font-size: 14.5px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-right: 6px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }

  footer { padding-top: 28px; padding-bottom: calc(28px + env(safe-area-inset-bottom)); color: var(--muted); font-size: 13px; }
  footer p { margin: 0 0 6px; max-width: 80ch; }

  .adv { margin: 0 0 14px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; }
  .adv summary { cursor: pointer; padding: 10px 0; font-size: 14px; color: var(--muted); }
  .adv[open] summary { color: var(--text); }
  .chk { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 12px; font-size: 14px; cursor: pointer; }
  .chk input { margin: 3px 0 0; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
  .cbox { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 12px; }
  .cinfo { display: grid; gap: 3px; margin: 2px 0 10px; font-size: 13px; color: var(--muted); }
  .cinfo b { color: var(--text); font-weight: 600; }
  .cinfo .note { color: var(--ok); }
  .pre { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .pre h2 { margin-bottom: 6px; }
  .pre .hint { margin: 0; min-height: 2.8em; }
  .pbar { height: 8px; margin: 8px 0 12px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .pfill { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .chk small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; }

  /* načítání */
  .load { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg) 94%, #000); }
  .load[hidden], dialog:not([open]) { display: none; }
  .load-box { width: 100%; max-width: 420px; text-align: center; }
  .ring { position: relative; width: 150px; height: 150px; margin: 0 auto 18px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { fill: none; stroke: var(--line); stroke-width: 7; }
  .ring .arc { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 276.46; stroke-dashoffset: 276.46; transition: stroke-dashoffset .25s ease; filter: drop-shadow(0 0 6px var(--accent)); }
  .ring.indet svg { animation: spin 1.1s linear infinite; }
  .ring.indet .arc { stroke-dashoffset: 190; transition: none; }
  .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  @keyframes spin { to { transform: rotate(270deg); } }
  .load h3 { margin: 0 0 4px; font-size: 22px; }
  .load .sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; min-height: 1.4em; }
  .steps { list-style: none; margin: 0 0 20px; padding: 0; text-align: left; display: grid; gap: 7px; font-size: 14.5px; }
  .steps li { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; color: var(--muted); }
  .steps li::before { content: "○"; text-align: center; }
  .steps li.cur { color: var(--text); }
  .steps li.cur::before { content: "◔"; color: var(--accent); }
  .steps li.done { color: var(--text); }
  .steps li.done::before { content: "✓"; color: var(--ok); font-weight: 800; }
  .steps li.fail { color: var(--bad); }
  .steps li.fail::before { content: "✕"; font-weight: 800; }
  .steps span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .btn2 { padding: 10px 20px; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .btn2:hover { border-color: var(--accent); }

  /* ovládání */
  dialog { width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 24px); padding: 0; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  .dlg-h { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  .dlg-h h3 { margin: 0; font-size: 18px; }
  .dlg-b { padding: 6px 20px 20px; overflow: auto; max-height: calc(100vh - 110px); }
  .dlg-b h4 { margin: 18px 0 8px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .dlg-b .note { margin: 14px 0 0; color: var(--muted); font-size: 14px; }
  .keys { display: grid; grid-template-columns: minmax(130px, auto) 1fr; gap: 6px 16px; align-items: baseline; font-size: 14.5px; }
  .keys kbd { display: inline-block; padding: 1px 7px; margin: 1px 2px 1px 0; font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; white-space: nowrap; }
  .keys span { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<header class="top">

<main>

    setProgress(0.88);

    mark(sData, 'cur');
    let dok = false; try { dok = (await fetch('/data-manifest', { method: 'HEAD', signal: sig })).ok; } catch (e) { if (sig.aborted) return; }
    if (!dok) return fail(sData, 'l_err_data');
    mark(sData, 'done'); setProgress(0.96);

    mark(sGo, 'cur'); sub.textContent = t('l_sub_go');
    setProgress(1);
    await new Promise(ok => setTimeout(ok, 350));
    if (sig.aborted) return;
    location.href = gameUrl(name);
  } catch (e) {
    if (sig.aborted) return;
    fail([sChk, sMod, sData, sGo].find(li => li.className === 'cur') || sMod, 'l_err_mod');
  }
}
function closeLoad() { abort?.abort(); abort = null; $('#load').hidden = true; document.body.style.overflow = ''; $('#cancel').textContent = t('cancel'); }
$('#cancel').addEventListener('click', closeLoad);
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#load').hidden) closeLoad(); });
addEventListener('pageshow', e => { if (e.persisted) closeLoad(); });

// ---- uložený modul a úložiště stránky (Cache Storage 'wasm-v1': loading.js a načítání pod tím) ----
let cacheNote = '';
const big = n => (n >= 1073741824 ? nf().format(n / 1073741824) + ' GB' : nf().format(n / 1048576) + ' ' + t('mb'));
async function cacheInfo() {
  const box = $('#cache-info'); if (!box) return;
  const lines = [];
  const line = (label, value) => { const d = el('div'); d.append(label + ': ', el('b', value)); lines.push(d); };
  if (cacheNote) lines.push(el('div', cacheNote, 'note'));
  try {
    // the game module(s) in the Cache Storage
    let mods = [];
    if (self.caches && await caches.has('wasm-v1')) {
      const c = await caches.open('wasm-v1');
      for (const k of await c.keys()) {
        const r = await c.match(k), u = new URL(k.url);
        mods.push({ name: u.pathname.split('/').pop(), bytes: +(r && r.headers.get('content-length')) || 0, ver: (u.searchParams.get('v') || '').replace(/"/g, '') });
      }
    }
    if (mods.length) for (const m of mods) line(t('cc_mod'), m.name + ' · ' + (m.bytes ? big(m.bytes) : '?') + (m.ver ? ' · ' + t('cc_ver') + ' ' + m.ver : ''));
    else line(t('cc_mod'), t('cc_none'));
    // everything this page keeps in the browser
    if (navigator.storage && navigator.storage.estimate) {
      const e = await navigator.storage.estimate();
      line(t('cc_site'), big(e.usage || 0) + (e.quota ? ' ' + t('cc_of') + ' ' + big(e.quota) : ''));
      const d = e.usageDetails;
      if (d) {
        const cacheB = d.caches || 0, fileB = (d.fileSystem || 0) + (d.indexedDB || 0), rest = Math.max(0, (e.usage || 0) - cacheB - fileB);
        line(t('cc_in'), t('cc_caches') + ' ' + big(cacheB) + ', ' + t('cc_files') + ' ' + big(fileB) + ', ' + t('cc_other') + ' ' + big(rest));
      }
    }
    if (navigator.storage && navigator.storage.persisted) line(t('cc_pers'), (await navigator.storage.persisted()) ? t('cc_yes') : t('cc_no'));
  } catch { /* the browser denies the numbers (private window): the button still works */ }
  box.textContent = ''; box.append(...lines);
}
$('#cache-clear').addEventListener('click', async () => {
  try { await caches.delete('wasm-v1'); store.set(GAME.id + '-bust', String(Date.now())); cacheNote = t('cc_done'); } catch { cacheNote = t('cc_fail'); }
  await cacheInfo();
  setTimeout(() => { cacheNote = ''; cacheInfo(); }, 6000);
});
$('#adv').addEventListener('toggle', cacheInfo);

// ---- the game's data in this browser (CMR 2005 streams 2.9 GB as it plays): download it ahead ----
// The predownload worker (/host/predownload-worker.js, src/host/predownload-worker.ts) writes the cache the game reads from
// (OPFS "cache/": a sparse file per game file and a ".have" map, a byte per 1 MiB block).  A game writes the same files, so
// Play stops the download first.  What it fetches is datacache.ts aheadFiles (all but movies, language and texture packs,
// and CMR's .wmv videos, which the browser game does not play).
const PRE = { w: null, state: 'idle', have: 0, total: 0, rate: 0, err: '', samples: [], onStopped: null };
const PRE_BLOCK = 1 << 20;
const preKey = f => f.path.replace(/[^A-Za-z0-9._-]/g, '_') + '.' + f.size + '.' + f.mtime;
const preFiles = m => m.files.filter(f => !f.d && !/^(movies|langpacks|texpacks)$/i.test(f.p.split('/')[0]) && !/\.wmv$/i.test(f.p))
  .map(f => ({ path: f.p, size: f.s ?? 0, mtime: f.m ?? 0 }));
async function preScan() {
  const r = await fetch('/data-manifest', { cache: 'no-cache' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const files = preFiles(await r.json());
  let total = 0, have = 0, dir = null;
  try { dir = await (await navigator.storage.getDirectory()).getDirectoryHandle('cache'); } catch { /* nothing cached yet */ }
  for (const f of files) {
    total += f.size;
    if (!dir) continue;
    try {
      const m = new Uint8Array(await (await (await dir.getFileHandle(preKey(f) + '.have')).getFile()).arrayBuffer());
      const nb = Math.ceil(f.size / PRE_BLOCK);
      if (m.length === nb) for (let i = 0; i < nb; i++) if (m[i]) have += Math.min(PRE_BLOCK, f.size - i * PRE_BLOCK);
    } catch { /* this file is not cached */ }
  }
  return { have, total };
}
function preRender() {
  const box = $('#pre'); if (!box) return;
  box.hidden = !GAME.predownload || PRE.state === 'unavailable';
  if (box.hidden) return;
  const fmt = n => (n >= 1073741824 ? nf().format(n / 1073741824) + ' GB' : nf().format(n / 1048576) + ' ' + t('mb'));
  const pct = PRE.total ? Math.min(100, PRE.have / PRE.total * 100) : 0;
  $('#pre-fill').style.width = pct + '%'; $('#pre-bar').setAttribute('aria-valuenow', String(Math.round(pct)));
  let msg = '';
  if (PRE.state === 'running') {
    const left = PRE.rate > 0 ? Math.ceil((PRE.total - PRE.have) / PRE.rate / 60) : 0;
    msg = t('pre_have') + ' ' + fmt(PRE.have) + ' ' + t('cc_of') + ' ' + fmt(PRE.total)
      + (PRE.rate > 0 ? ' · ' + nf().format(PRE.rate / 1048576) + ' ' + t('mb') + '/s' + (left ? ' · ' + t('pre_left') + ' ~' + left + ' min' : '') : '');
  } else if (PRE.state === 'done') msg = t('pre_done') + ' (' + fmt(PRE.total) + ')';
  else if (PRE.state === 'error') msg = t('pre_err') + ' ' + PRE.err;
  else if (PRE.total) msg = (PRE.have > 0 ? t('pre_have') + ' ' + fmt(PRE.have) + ' ' + t('cc_of') + ' ' + fmt(PRE.total) + '. ' : '') + t('pre_note').replace('{n}', fmt(Math.max(0, PRE.total - PRE.have)));
  $('#pre-info').textContent = msg;
  const go = $('#pre-go'); go.hidden = PRE.state === 'done';
  go.textContent = PRE.state === 'running' ? t('pre_stop') : (PRE.have > 0 ? t('pre_cont') : t('pre_go'));
}
function preStart() {
  if (PRE.w) return;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch { /* the browser decides */ }
  let w;
  try { w = PRE.w = new Worker('/host/predownload-worker.js', { type: 'module', name: 'predownload' }); }
  catch (e) { PRE.state = 'error'; PRE.err = String(e && e.message || e); preRender(); return; }
  PRE.state = 'running'; PRE.err = ''; PRE.samples = []; PRE.rate = 0;
  w.onmessage = e => {
    if (w !== PRE.w) return;
    const m = e.data;
    if (m.t === 'progress') {
      const now = performance.now();
      PRE.samples.push({ t: now, have: m.have });
      while (PRE.samples.length > 2 && now - PRE.samples[0].t > 10000) PRE.samples.shift();
      const a = PRE.samples[0], span = (now - a.t) / 1000;
      PRE.have = m.have; PRE.total = m.total; PRE.rate = span >= 2 ? (m.have - a.have) / span : 0;
    } else if (m.t === 'done') { w.terminate(); PRE.w = null; PRE.state = 'done'; PRE.have = m.have; PRE.total = m.total; PRE.rate = 0; }
    else if (m.t === 'error') { w.terminate(); PRE.w = null; PRE.state = 'error'; PRE.err = m.msg; PRE.rate = 0; }
    else if (m.t === 'stopped' && PRE.onStopped) PRE.onStopped();
    preRender();
  };
  w.onerror = e => { if (w !== PRE.w) return; w.terminate(); PRE.w = null; PRE.state = 'error'; PRE.err = e.message || 'the download stopped unexpectedly'; PRE.rate = 0; preRender(); };
  w.postMessage({ t: 'start', manifestUrl: '/data-manifest', dataBase: '/data/', language: 'en', texpack: '' });
  preRender();
}
// stop it and wait until its files are closed (a few seconds at most), then count what the cache holds
function preStop() {
  const w = PRE.w;
  if (!w) return Promise.resolve();
  return new Promise(res => {
    const fin = () => { clearTimeout(tm); w.terminate(); if (PRE.w === w) PRE.w = null; PRE.onStopped = null; PRE.state = 'idle'; res(); };
    const tm = setTimeout(fin, 3000);
    PRE.onStopped = fin; w.postMessage({ t: 'stop' });
  }).then(async () => { try { const s = await preScan(); PRE.have = s.have; PRE.total = s.total; } catch { /* the numbers stay */ } PRE.rate = 0; preRender(); });
}
async function preInit() {
  if (!GAME.predownload) return;
  try {
    const s = await preScan(); PRE.have = s.have; PRE.total = s.total;
    PRE.state = s.total > 0 && s.have >= s.total ? 'done' : 'idle';
    if (!s.total) PRE.state = 'unavailable';
  } catch { PRE.state = 'unavailable'; }
  preRender();
}
$('#pre-go').addEventListener('click', () => { if (PRE.w) void preStop(); else preStart(); });

// ---- formulář ----
const name = $('#name'), err = $('#err');
name.value = store.get(GAME.storeKey) || '';
$('#res').value = store.get(GAME.id + '-res') || '';
$('#touch').value = store.get(GAME.id + '-touch') || '';
try { const sv = JSON.parse(store.get(GAME.id + '-opts') || '{}'); for (const k of OPTS) $('#o-' + k).checked = !!sv[k]; } catch {}
if (/[?&]debug/.test(location.search)) $('#adv').open = true;
// ---- postup hráče: složka v prohlížeči (OPFS) <-> zip <-> server (/saves/<klíč>) ----
const syKey = n => GAME.savePrefix + n.toLowerCase();
const syName = () => { const n = name.value.trim(); return /^[A-Za-z0-9_-]{2,15}$/.test(n) ? n : ''; };
const crcT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = crcT[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zipMake(entries) {                       // "stored" entries only, UTF-8 names
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  for (const e of entries) {
    const nm = enc.encode(e.name), crc = crc32(e.data), len = e.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x800, true); h.setUint16(12, 0x21, true);
    h.setUint32(14, crc, true); h.setUint32(18, len, true); h.setUint32(22, len, true); h.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(h.buffer), nm, e.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x800, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true); c.setUint32(20, len, true); c.setUint32(24, len, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    cen.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + len;
  }
  const cs = cen.reduce((a, b) => a + b.length, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cs, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...cen, new Uint8Array(end.buffer)], { type: 'application/zip' });
}
async function zipRead(buf) {                     // stored and deflated entries
  const u = new Uint8Array(buf), v = new DataView(buf); let e = u.length - 22;
  while (e >= 0 && v.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('zip');
  const n = v.getUint16(e + 10, true); let p = v.getUint32(e + 16, true); const out = [];
  for (let i = 0; i < n; i++) {
    if (v.getUint32(p, true) !== 0x02014b50) throw new Error('zip');
    const meth = v.getUint16(p + 10, true), cs = v.getUint32(p + 20, true), nl = v.getUint16(p + 28, true), xl = v.getUint16(p + 30, true), cl = v.getUint16(p + 32, true), lo = v.getUint32(p + 42, true);
    const nm = new TextDecoder().decode(u.subarray(p + 46, p + 46 + nl)); p += 46 + nl + xl + cl;
    const ds = lo + 30 + v.getUint16(lo + 26, true) + v.getUint16(lo + 28, true), raw = u.subarray(ds, ds + cs);
    let data;
    if (meth === 0) data = raw.slice();
    else if (meth === 8) data = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else throw new Error('zip method');
    if (!nm.endsWith('/')) out.push({ name: nm, data });
  }
  return out;
}
async function syLocal(n) {                       // the files of the player's folder in the browser
  const out = [];
  let d; try { d = await (await navigator.storage.getDirectory()).getDirectoryHandle(syKey(n)); } catch { return out; }
  const walk = async (h, pre) => {
    for await (const [nm, c] of h.entries()) {
      if (c.kind === 'directory') await walk(c, pre + nm + '/');
      else { try { const f = await c.getFile(); out.push({ name: pre + nm, data: new Uint8Array(await f.arrayBuffer()), mtime: f.lastModified }); } catch { /* open in a game */ } }
    }
  };
  await walk(d, ''); return out;
}
async function syWrite(n, files) {                // replaces the folder
  const root = await navigator.storage.getDirectory();
  try { await root.removeEntry(syKey(n), { recursive: true }); } catch { /* none yet */ }
  const d = await root.getDirectoryHandle(syKey(n), { create: true });
  for (const f of files) {
    const ps = f.name.split('/').filter(x => x && x !== '.' && x !== '..'); if (!ps.length) continue;
    let h = d; for (const q of ps.slice(0, -1)) h = await h.getDirectoryHandle(q, { create: true });
    const w = await (await h.getFileHandle(ps[ps.length - 1], { create: true })).createWritable(); await w.write(f.data); await w.close();
  }
}
// the server's copy: its time (ms), 0 none, -1 no server for it
async function syServer(n) {
  try { const r = await fetch('/saves/' + syKey(n), { method: 'HEAD', cache: 'no-store' }); return r.ok ? (Date.parse(r.headers.get('last-modified') || '') || 1) : r.status === 404 ? 0 : -1; } catch { return -1; }
}
let syMsg = '';
const syKb = b => nf().format(Math.max(1, Math.round(b / 1024))) + ' KB';
async function syPush(n, loc) {
  loc = loc || await syLocal(n);
  if (!loc.length) { syMsg = t('sy_nolocal'); return false; }
  const blob = zipMake(loc);
  if (blob.size > 16e6) { syMsg = t('sy_big'); return false; }
  const r = await fetch('/saves/' + syKey(n), { method: 'PUT', body: blob });
  if (!r.ok) { syMsg = t('sy_down'); return false; }
  syMsg = t('sy_pushed') + ' ' + loc.length + ' · ' + syKb(blob.size); return true;
}
async function syPull(n) {
  const r = await fetch('/saves/' + syKey(n), { cache: 'no-store' });
  if (r.status === 404) { syMsg = t('sy_noserver'); return false; }
  if (!r.ok) { syMsg = t('sy_down'); return false; }
  const files = await zipRead(await r.arrayBuffer());
  await syWrite(n, files); syMsg = t('sy_pulled') + ' ' + files.length; return true;
}
// after the name is entered (and before Play): a folder with nothing in it takes the server's copy; a newer folder goes up
async function syAuto() {
  if (!GAME.sync) return;
  const n = syName(); if (!n) { await syShow(); return; }
  try {
    const sv = await syServer(n);
    if (sv >= 0) {
      const loc = await syLocal(n), lm = loc.reduce((m, f) => Math.max(m, f.mtime), 0);
      if (!loc.length) { if (sv > 0) await syPull(n); }
      else if (lm > sv + 2000) await syPush(n, loc);
      else if (sv > lm + 2000) syMsg = t('sy_newer');
    }
  } catch { syMsg = t('sy_fail'); }
  await syShow();
}
async function syShow() {
  const box = $('#sy-line'); if (!box) return;
  const n = syName(); let txt = syMsg;
  if (!txt && n) {
    try { const sv = await syServer(n), loc = await syLocal(n); txt = loc.length ? t('sy_have') + ' ' + loc.length : t('sy_nolocal');
      txt += sv > 0 ? ' · ' + t('sy_srv') + ' ' + new Date(sv).toLocaleString(lang === 'cs' ? 'cs-CZ' : 'en-GB') : sv === 0 ? ' · ' + t('sy_noserver') : ''; } catch { txt = ''; }
  }
  box.textContent = txt;
}
function syBind() {
  $('#sync').hidden = !GAME.sync; if (!GAME.sync) return;
  const run = f => async () => { const n = syName(); if (!n) { syMsg = t('sy_need'); return syShow(); } try { await f(n); } catch (e) { syMsg = t('sy_fail'); } await syShow(); setTimeout(() => { syMsg = ''; syShow(); }, 8000); };
  $('#sy-pull').addEventListener('click', run(n => syPull(n)));
  $('#sy-push').addEventListener('click', run(n => syPush(n)));
  $('#sy-exp').addEventListener('click', run(async n => {
    const loc = await syLocal(n); if (!loc.length) { syMsg = t('sy_nolocal'); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(zipMake(loc)); a.download = syKey(n) + '.zip'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    syMsg = t('sy_saved') + ' ' + loc.length;
  }));
  $('#sy-imp').addEventListener('click', () => $('#sy-file').click());
  $('#sy-file').addEventListener('change', run(async n => {
    const f = $('#sy-file').files[0]; $('#sy-file').value = ''; if (!f) return;
    const files = await zipRead(await f.arrayBuffer()); await syWrite(n, files); syMsg = t('sy_imported') + ' ' + files.length;
  }));
  name.addEventListener('change', () => { syMsg = ''; syAuto(); });
}

let forced = false;
$('#force').addEventListener('click', () => { forced = true; $('#f').requestSubmit(); });
$('#f').addEventListener('submit', e => {
  e.preventDefault();
  const n = name.value.trim();
  if (!/^[A-Za-z0-9_-]{2,15}$/.test(n)) { err.textContent = t('badname'); name.focus(); return; }
  err.textContent = '';
  store.set(GAME.id + '-opts', JSON.stringify(optsGet()));
  store.set(GAME.storeKey, n); store.set(GAME.id + '-res', $('#res').value); store.set(GAME.id + '-touch', $('#touch').value);
  const f = forced; forced = false;
  preStop().then(() => syAuto().catch(() => {})).then(() => launch(n, f));
});
name.addEventListener('input', () => { err.textContent = ''; });
$('#lang').addEventListener('click', () => { lang = lang === 'cs' ? 'en' : 'cs'; store.set('landing-lang', lang); render(); });

render();
syBind();
syAuto();
runChecks();
probe();
preInit();
</script>
