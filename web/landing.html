<title>Warcraft III: The Frozen Throne v prohlížeči</title>

<meta name="theme-color" content="#0b0e16">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M16 5l3 8 8 3-8 3-3 8-3-8-8-3 8-3z' fill='%23d9a441'/%3E%3C/svg%3E">
<style>
  /* Jeden soubor bez závislostí: server posílá COEP require-corp, takže žádné externí písmo, obrázek ani skript. */
  :root { --bg: #0b0e16; --panel: #151a26; --text: #e8e6df; --muted: #9c9a92; --accent: #d9a441; --accent2: #f0c76a; --accent-ink: #1a1408;
          --line: #283044; --ok: #6fcf8e; --bad: #ff7a6b; --warn: #e9b44c;
          --art: radial-gradient(900px 520px at 82% -8%, rgba(111,180,232,.24), transparent 62%), radial-gradient(760px 520px at 8% 0%, rgba(217,164,65,.16), transparent 60%),
                 repeating-linear-gradient(115deg, rgba(255,255,255,.016) 0 2px, transparent 2px 16px); }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; position: relative; overflow-x: hidden; }
  .bg { position: fixed; inset: 0; z-index: 0; background: var(--art); pointer-events: none; }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 40%, var(--bg) 100%); }
  main, .top, footer { position: relative; z-index: 1; width: 100%; max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:hover { color: var(--accent2); }
  button, select, input { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 18px; padding-bottom: 6px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .02em; color: var(--muted); font-size: 14px; }
  .brand svg { width: 28px; height: 28px; color: var(--accent); }
  .top-end { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px;
          background: color-mix(in srgb, var(--panel) 80%, transparent); color: var(--text); font-size: 14px; text-decoration: none; cursor: pointer; backdrop-filter: blur(6px); }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip svg { width: 16px; height: 16px; fill: currentColor; }

  .hero { padding: 7vh 0 22px; }
  .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  h1 { margin: 0 0 12px; font-size: clamp(30px, 6.2vw, 56px); line-height: 1.05; letter-spacing: -.01em; font-weight: 800; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--accent); }
  .lead { margin: 0; max-width: 56ch; color: var(--muted); font-size: clamp(16px, 2.2vw, 19px); }

  .card { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 22px; backdrop-filter: blur(8px); }
  .play { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 8px; }
  @media (max-width: 760px) { .play { grid-template-columns: 1fr; } }
  h2 { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  label { display: block; font-size: 14px; margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  input[type=text], select { width: 100%; padding: 11px 12px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font-size: 16px; }
  input[type=text]:focus-visible, select:focus-visible { outline-offset: 1px; border-color: var(--accent); }
  .hint { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .err { margin: 8px 0 0; font-size: 14px; color: var(--bad); min-height: 1.4em; }
  .go { width: 100%; margin-top: 4px; padding: 14px; font-size: 18px; font-weight: 800; letter-spacing: .02em; color: var(--accent-ink);
        background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; transition: transform .12s, filter .12s, box-shadow .12s;
        box-shadow: 0 6px 24px -8px var(--accent); }
  .go:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .go:active { transform: none; }
  .go:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }
  .linklike { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 13px; }

  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .checks li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: 15px; }
  .checks .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--line); color: var(--muted); }
  .checks .ok .ic { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
  .checks .bad .ic { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad); }
  .checks .warn .ic { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
  .checks small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .srv { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: grid; gap: 3px; }
  .srv b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--bad); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 14px 0 0; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .grid .card { padding: 18px; }
  .grid ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14.5px; }
  .grid li { margin-bottom: 5px; }
  .grid p { margin: 0 0 12px; color: var(--muted); font-size: 14.5px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-right: 6px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }

  footer { padding-top: 28px; padding-bottom: calc(28px + env(safe-area-inset-bottom)); color: var(--muted); font-size: 13px; }
  footer p { margin: 0 0 6px; max-width: 80ch; }

  .adv { margin: 0 0 14px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; }
  .adv summary { cursor: pointer; padding: 10px 0; font-size: 14px; color: var(--muted); }
  .adv[open] summary { color: var(--text); }
  .chk { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 12px; font-size: 14px; cursor: pointer; }
  .chk input { margin: 3px 0 0; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
  .cbox { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 12px; }
  .cinfo { display: grid; gap: 3px; margin: 2px 0 10px; font-size: 13px; color: var(--muted); }
  .cinfo b { color: var(--text); font-weight: 600; }
  .cinfo .note { color: var(--ok); }
  .chk small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; }

  /* načítání */
  .load { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg) 94%, #000); }
  .load[hidden], dialog:not([open]) { display: none; }
  .load-box { width: 100%; max-width: 420px; text-align: center; }
  .ring { position: relative; width: 150px; height: 150px; margin: 0 auto 18px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { fill: none; stroke: var(--line); stroke-width: 7; }
  .ring .arc { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 276.46; stroke-dashoffset: 276.46; transition: stroke-dashoffset .25s ease; filter: drop-shadow(0 0 6px var(--accent)); }
  .ring.indet svg { animation: spin 1.1s linear infinite; }
  .ring.indet .arc { stroke-dashoffset: 190; transition: none; }
  .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  @keyframes spin { to { transform: rotate(270deg); } }
  .load h3 { margin: 0 0 4px; font-size: 22px; }
  .load .sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; min-height: 1.4em; }
  .steps { list-style: none; margin: 0 0 20px; padding: 0; text-align: left; display: grid; gap: 7px; font-size: 14.5px; }
  .steps li { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; color: var(--muted); }
  .steps li::before { content: "○"; text-align: center; }
  .steps li.cur { color: var(--text); }
  .steps li.cur::before { content: "◔"; color: var(--accent); }
  .steps li.done { color: var(--text); }
  .steps li.done::before { content: "✓"; color: var(--ok); font-weight: 800; }
  .steps li.fail { color: var(--bad); }
  .steps li.fail::before { content: "✕"; font-weight: 800; }
  .steps span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .btn2 { padding: 10px 20px; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .btn2:hover { border-color: var(--accent); }

  /* ovládání */
  dialog { width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 24px); padding: 0; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  .dlg-h { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  .dlg-h h3 { margin: 0; font-size: 18px; }
  .dlg-b { padding: 6px 20px 20px; overflow: auto; max-height: calc(100vh - 110px); }
  .dlg-b h4 { margin: 18px 0 8px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .dlg-b .note { margin: 14px 0 0; color: var(--muted); font-size: 14px; }
  .keys { display: grid; grid-template-columns: minmax(130px, auto) 1fr; gap: 6px 16px; align-items: baseline; font-size: 14.5px; }
  .keys kbd { display: inline-block; padding: 1px 7px; margin: 1px 2px 1px 0; font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; white-space: nowrap; }
  .keys span { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<div class="bg" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3l2.6 7.4L26 13l-7.4 2.6L16 23l-2.6-7.4L6 13l7.4-2.6z"/></svg>
    <span data-t="fanproject"></span>
  </div>
  <div class="top-end">

</header>

<main>
  <section class="hero">
    <p class="eyebrow" data-g="eyebrow"></p>
    <h1></h1>
    <p class="lead" data-g="lead"></p>
  </section>

  <section class="card play">
    <form id="f" novalidate>
      <h2 data-t="start"></h2>
      <div class="field">
        <label for="name" data-t="player"></label>
        <input id="name" type="text" maxlength="15" autocomplete="nickname" autocapitalize="off" spellcheck="false" required pattern="[A-Za-z0-9_\-]{2,15}">
        <p class="hint" data-t="namehint"></p>
        <p class="err" id="err" role="alert"></p>
      </div>
      <div class="field">
        <label for="res" data-t="res"></label>
        <select id="res">
          <option value="" data-t="resauto"></option>
          <option value="1280x720">1280 × 720</option>
          <option value="1600x900">1600 × 900</option>
          <option value="1920x1080">1920 × 1080</option>
        </select>
        <p class="hint" data-t="reshint"></p>
      </div>
      <div class="field" id="touchf" hidden>
        <label for="touch" data-t="touch"></label>
        <select id="touch">
          <option value="" data-t="touchauto"></option>
          <option value="on" data-t="touchon"></option>
          <option value="off" data-t="touchoff"></option>
        </select>
        <p class="hint" data-t="touchhint"></p>
      </div>
      <details class="adv" id="adv">
        <summary data-t="adv"></summary>
        <label class="chk"><input type="checkbox" id="o-showlog"><span><span data-t="o_showlog"></span><small data-t="o_showlog_h"></small></span></label>
        <label class="chk"><input type="checkbox" id="o-logpost"><span><span data-t="o_logpost"></span><small data-t="o_logpost_h"></small></span></label>
        <label class="chk"><input type="checkbox" id="o-noload"><span><span data-t="o_noload"></span><small data-t="o_noload_h"></small></span></label>
        <label class="chk"><input type="checkbox" id="o-nocache"><span><span data-t="o_nocache"></span><small data-t="o_nocache_h"></small></span></label>
        <div class="cinfo" id="cache-info" aria-live="polite"></div>
        <div class="cbox"><button type="button" class="chip" id="cache-clear" data-t="cc_btn"></button></div>
      </details>
      <button class="go" id="go" type="submit" data-t="play"></button>
      <p class="hint"><span data-g="dlnote"></span> <button type="button" class="linklike" id="force" hidden data-t="force"></button></p>
    </form>
    <div>
      <h2 data-t="envh"></h2>
      <ul class="checks" id="checks"></ul>
      <div class="srv" id="srv"></div>
    </div>
  </section>

  <section class="grid">
    <div class="card">
      <h2 data-t="ctlh"></h2>
      <p data-g="ctlp"></p>
      <button class="chip" id="ctl-open" type="button" data-t="ctlbtn"></button>
    </div>
    <div class="card">
      <h2 data-t="stath"></h2>
      <ul id="status"></ul>
    </div>
    <div class="card">
      <h2 data-t="needh"></h2>
      <ul id="need"></ul>
    </div>
  </section>
</main>

<footer>
  <p data-g="disclaimer"></p>
  <p><span data-t="method"></span> <a href="https://github.com/Chuck3CZ/nfsu2-web" target="_blank" rel="noopener noreferrer">nfsu2-web</a> · <a href="https://github.com/Chuck3CZ/wc3-web" target="_blank" rel="noopener noreferrer" data-t="source"></a> · <span id="ver"></span></p>
</footer>

<div class="load" id="load" hidden role="dialog" aria-modal="true" aria-labelledby="load-h">
  <div class="load-box">
    <div class="ring indet" id="ring">

      <div class="pct" id="pct" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>

    <h3 id="load-h" data-t="loading"></h3>
    <p class="sub" id="sub" aria-live="polite"></p>
    <ul class="steps" id="steps"></ul>
    <button class="btn2" id="cancel" type="button" data-t="cancel"></button>
  </div>
</div>

<dialog id="ctl" aria-labelledby="ctl-h">
  <div class="dlg-h"><h3 id="ctl-h" data-t="ctlh"></h3><button class="chip" id="ctl-close" type="button" data-t="close"></button></div>
  <div class="dlg-b" id="ctl-b"></div>
</dialog>

const tx = v => (Array.isArray(v) ? (v[L()] ?? v[0]) : v);

function el(tag, text, cls) { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }

// ---- kontrola prohlížeče ----
async function runChecks() {
  const r = [];
  const add = (id, state, bad) => r.push({ id, state, bad });
  add('c_secure', window.isSecureContext ? 'ok' : 'bad', 'c_secure_bad');
  add('c_iso', (crossOriginIsolated && typeof SharedArrayBuffer !== 'undefined') ? 'ok' : 'bad', 'c_iso_bad');
  let gpu = 'bad', gpuMsg = 'c_gpu_bad';
  if (navigator.gpu) { try { gpu = (await navigator.gpu.requestAdapter()) ? 'ok' : 'bad'; gpuMsg = 'c_gpu_none'; } catch { gpu = 'bad'; } }
  add('c_gpu', gpu, gpuMsg);
  add('c_opfs', (navigator.storage && navigator.storage.getDirectory) ? 'ok' : 'bad', 'c_opfs_bad');
  const brands = (navigator.userAgentData?.brands || []).map(b => b.brand).join(' ');
  const chromium = /Chrom(e|ium)|Edg/.test(brands + ' ' + navigator.userAgent) && !/OPR|Firefox/.test(navigator.userAgent);
  add('c_br', chromium ? 'ok' : 'warn', 'c_br_warn');
  if (!GAME.touch) add('c_ptr', matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches ? 'warn' : 'ok', 'c_ptr_warn');
  ckResults = r;
  drawChecks();
  return r;
}
function drawChecks() {
  const ul = $('#checks'); ul.textContent = '';
  if (!ckResults.length) { const li = el('li', t('checking')); li.style.color = 'var(--muted)'; ul.append(li); return; }
  for (const c of ckResults) {
    const li = el('li', null, c.state);
    li.append(el('span', c.state === 'ok' ? '✓' : c.state === 'bad' ? '✕' : '!', 'ic'));
    const d = el('div', t(c.id));
    if (c.state !== 'ok') d.append(el('small', t(c.bad)));
    li.append(d); ul.append(li);
  }
  const hard = ckResults.some(c => c.state === 'bad');
  $('#force').hidden = !hard;
}

// ---- server: verze modulu a data ----
let srv = null, modEtag = '';
// The module's address carries its version (ETag) and a counter the "clear" button raises: a new build, or a cleared module,
// is a new address the browser has never cached, so a stale or damaged cache entry can never be reused
const bust = () => store.get(GAME.id + '-bust') || '0';
const wasmUrl = () => GAME.wasm + '?v=' + encodeURIComponent(modEtag) + '&r=' + encodeURIComponent(bust());
async function probe() {
  srv = { ok: false };
  try {
    const r = await fetch(GAME.wasm, { method: 'HEAD' });
    if (r.ok) {
      modEtag = r.headers.get('etag') || r.headers.get('last-modified') || '';
      srv = { ok: true, size: +r.headers.get('content-length') || 0, mod: r.headers.get('last-modified') ? new Date(r.headers.get('last-modified')) : null };
      try { srv.data = (await fetch('/data-manifest', { method: 'HEAD' })).ok; } catch { srv.data = false; }
    }
  } catch {}
  drawSrv();
}
function drawSrv() {
  const box = $('#srv'); box.textContent = '';
  if (!srv) return;
  if (!srv.ok) { box.append(el('span', t('s_srv'))); return; }
  const row = (k, v, dot) => { const d = el('div'); if (dot) d.append(el('span', null, 'dot ' + dot)); d.append(k + ': ', el('b', v)); box.append(d); };
  const when = srv.mod ? ', ' + t('s_up') + ' ' + srv.mod.toLocaleString(lang === 'cs' ? 'cs-CZ' : 'en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : '';
  row(t('s_mod'), (srv.size ? nf().format(srv.size / 1048576) + ' ' + t('mb') : t('s_ok')) + when, 'on');
  row(t('s_data'), srv.data ? t('s_ok') : t('s_no'), srv.data ? 'on' : 'off');
  $('#ver').textContent = srv.mod ? srv.mod.toLocaleDateString(lang === 'cs' ? 'cs-CZ' : 'en-GB') : '';
}

// ---- ovládání ----
function drawControls() {
  const b = $('#ctl-b'); b.textContent = '';
  for (const sec of GAME.controls) {
    b.append(el('h4', tx(sec.h)));
    const g = el('div', null, 'keys');
    for (const [keys, what] of sec.rows) {
      const k = el('div'); for (const x of keys) k.append(el('kbd', tx(x)));
      g.append(k, el('span', tx(what)));
    }
    b.append(g);
  }
  if (GAME.ctlnote) b.append(el('p', tx(GAME.ctlnote), 'note'));
}
$('#ctl-open').addEventListener('click', () => { const d = $('#ctl'); if (d.showModal) d.showModal(); else d.setAttribute('open', ''); });
$('#ctl-close').addEventListener('click', () => $('#ctl').close());
$('#ctl').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

// ---- načítání ----
const ring = $('#ring'), arc = $('#arc'), pct = $('#pct'), sub = $('#sub'), stepsEl = $('#steps');
let abort = null;
function setProgress(f) {
  if (f == null) { ring.classList.add('indet'); pct.textContent = ''; pct.setAttribute('aria-valuenow', '0'); return; }
  ring.classList.remove('indet');
  const p = Math.max(0, Math.min(1, f));
  arc.style.strokeDashoffset = String(276.46 * (1 - p));
  pct.textContent = Math.round(p * 100) + ' %'; pct.setAttribute('aria-valuenow', String(Math.round(p * 100)));
}
function mkSteps(keys) {
  stepsEl.textContent = '';
  return keys.map(k => { const li = el('li'); li.append(el('span', t(k)), el('span', '')); stepsEl.append(li); return li; });
}
const mark = (li, s, note) => { li.className = s; li.lastChild.textContent = note || ''; };

const OPTS = ['showlog', 'logpost', 'noload', 'nocache'];
const optsGet = () => Object.fromEntries(OPTS.map(k => [k, $('#o-' + k).checked]));
function gameUrl(name) {
  const q = new URLSearchParams();
  q.set('wasm', wasmUrl()); q.set('pages', String(GAME.pages)); q.set('arg', GAME.exe);
  q.append('env', 'WC3_SAVEDIR=/save'); q.append('env', 'WC3_READONLY_DATA=1');
  q.set('theme', GAME.id); q.set('gpu', ''); q.set('net', name); q.set('save', GAME.savePrefix + name.toLowerCase());
  const res = $('#res').value; if (res) q.set('res', res);
  if (GAME.touch) { const tv = $('#touch').value; if (tv === 'on') q.set('touch', ''); else if (tv === 'off') q.set('notouch', ''); }
  for (const [k, on] of Object.entries(optsGet())) if (on) q.set(k, '');
  return '/test/hostcheck.html?' + q.toString();
}

async function launch(name, force) {
  $('#load').hidden = false;
  document.body.style.overflow = 'hidden';
  abort = new AbortController();
  const sig = abort.signal;
  const [sChk, sMod, sData, sGo] = mkSteps(['l_chk', 'l_mod', 'l_data', 'l_go']);
  sub.textContent = t('l_sub0'); setProgress(null);
  const fail = (li, key) => { mark(li, 'fail'); sub.textContent = t(key); setProgress(null); ring.classList.remove('indet'); arc.style.strokeDashoffset = '276.46'; pct.textContent = '✕'; $('#cancel').textContent = t('back'); };
  try {
    mark(sChk, 'cur');
    const res = ckResults.length ? ckResults : await runChecks();
    if (sig.aborted) return;
    if (!force) { const bad = res.find(c => c.state === 'bad'); if (bad) { closeLoad(); err.textContent = t(bad.bad); return; } }
    mark(sChk, 'done');

    mark(sMod, 'cur'); sub.textContent = t('l_sub_mod');
    const o = optsGet();
    if (o.nocache || o.noload) mark(sMod, 'done', t('skipped'));
    else {
    // the module goes into the Cache Storage under its ETag (the HTTP cache refuses a file this big); the game's page
    // (loading.js) reads the same entry, so the module comes over the network once per version
    let etag = '', total = 0;
    try { const h = await fetch(GAME.wasm, { method: 'HEAD', signal: sig }); etag = h.headers.get('etag') || h.headers.get('last-modified') || ''; total = +h.headers.get('content-length') || 0; modEtag = etag; } catch (e) { if (sig.aborted) return; }
    let cache = null; try { cache = await caches.open('wasm-v1'); } catch {}
    const key = etag ? GAME.wasm + '?v=' + encodeURIComponent(etag) : '';
    let hit = false; if (cache && key) { try { hit = !!(await cache.match(key)); } catch {} }
    let got = 0;
    if (hit) mark(sMod, 'done', t('cached'));
    else {
      const r = await fetch(wasmUrl(), { signal: sig });
      if (!r.ok || !r.body) return fail(sMod, 'l_err_mod');
      total = total || +r.headers.get('content-length') || 0;
      let body = r.body, put = null;
      if (cache && key) { const [a, b] = body.tee(); body = a; put = cache.put(key, new Response(b, { status: 200, headers: r.headers })).catch(() => {}); }
      const rd = body.getReader(); let last = 0;
      for (;;) {
        const { done, value } = await rd.read();
        if (done) break;
        got += value.length;
        const now = performance.now();
        if (now - last > 80) { last = now; if (total) { setProgress(got / total * 0.85); mark(sMod, 'cur', nf().format(got / 1048576) + ' / ' + nf().format(total / 1048576) + ' ' + t('mb')); } else mark(sMod, 'cur', nf().format(got / 1048576) + ' ' + t('mb')); }
      }
      if (put) await put;
      if (cache && key) { try { for (const k of await cache.keys()) if (new URL(k.url).pathname === GAME.wasm && !k.url.endsWith(key)) await cache.delete(k); } catch {} }
      mark(sMod, 'done', nf().format(got / 1048576) + ' ' + t('mb'));
    }
    }
    setProgress(0.88);

    mark(sData, 'cur');
    let dok = false; try { dok = (await fetch('/data-manifest', { method: 'HEAD', signal: sig })).ok; } catch (e) { if (sig.aborted) return; }
    if (!dok) return fail(sData, 'l_err_data');
    mark(sData, 'done'); setProgress(0.96);

    mark(sGo, 'cur'); sub.textContent = t('l_sub_go');
    setProgress(1);
    await new Promise(ok => setTimeout(ok, 350));
    if (sig.aborted) return;
    location.href = gameUrl(name);
  } catch (e) {
    if (sig.aborted) return;
    fail([sChk, sMod, sData, sGo].find(li => li.className === 'cur') || sMod, 'l_err_mod');
  }
}
function closeLoad() { abort?.abort(); abort = null; $('#load').hidden = true; document.body.style.overflow = ''; $('#cancel').textContent = t('cancel'); }
$('#cancel').addEventListener('click', closeLoad);
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#load').hidden) closeLoad(); });

// ---- uložený modul a úložiště stránky (Cache Storage 'wasm-v1': loading.js a načítání pod tím) ----
let cacheNote = '';
const big = n => (n >= 1073741824 ? nf().format(n / 1073741824) + ' GB' : nf().format(n / 1048576) + ' ' + t('mb'));
async function cacheInfo() {
  const box = $('#cache-info'); if (!box) return;
  const lines = [];
  const line = (label, value) => { const d = el('div'); d.append(label + ': ', el('b', value)); lines.push(d); };
  if (cacheNote) lines.push(el('div', cacheNote, 'note'));
  try {
    // the game module(s) in the Cache Storage
    let mods = [];
    if (self.caches && await caches.has('wasm-v1')) {
      const c = await caches.open('wasm-v1');
      for (const k of await c.keys()) {
        const r = await c.match(k), u = new URL(k.url);
        mods.push({ name: u.pathname.split('/').pop(), bytes: +(r && r.headers.get('content-length')) || 0, ver: (u.searchParams.get('v') || '').replace(/"/g, '') });
      }
    }
    if (mods.length) for (const m of mods) line(t('cc_mod'), m.name + ' · ' + (m.bytes ? big(m.bytes) : '?') + (m.ver ? ' · ' + t('cc_ver') + ' ' + m.ver : ''));
    else line(t('cc_mod'), t('cc_none'));
    // everything this page keeps in the browser
    if (navigator.storage && navigator.storage.estimate) {
      const e = await navigator.storage.estimate();
      line(t('cc_site'), big(e.usage || 0) + (e.quota ? ' ' + t('cc_of') + ' ' + big(e.quota) : ''));
      const d = e.usageDetails;
      if (d) {
        const cacheB = d.caches || 0, fileB = (d.fileSystem || 0) + (d.indexedDB || 0), rest = Math.max(0, (e.usage || 0) - cacheB - fileB);
        line(t('cc_in'), t('cc_caches') + ' ' + big(cacheB) + ', ' + t('cc_files') + ' ' + big(fileB) + ', ' + t('cc_other') + ' ' + big(rest));
      }
    }
    if (navigator.storage && navigator.storage.persisted) line(t('cc_pers'), (await navigator.storage.persisted()) ? t('cc_yes') : t('cc_no'));
  } catch { /* the browser denies the numbers (private window): the button still works */ }
  box.textContent = ''; box.append(...lines);
}
$('#cache-clear').addEventListener('click', async () => {
  try { await caches.delete('wasm-v1'); store.set(GAME.id + '-bust', String(Date.now())); cacheNote = t('cc_done'); } catch { cacheNote = t('cc_fail'); }
  await cacheInfo();
  setTimeout(() => { cacheNote = ''; cacheInfo(); }, 6000);
});

name.value = store.get(GAME.storeKey) || '';

try { const sv = JSON.parse(store.get(GAME.id + '-opts') || '{}'); for (const k of OPTS) $('#o-' + k).checked = !!sv[k]; } catch {}
if (/[?&]debug/.test(location.search)) $('#adv').open = true;
let forced = false;

  err.textContent = '';
  store.set(GAME.id + '-opts', JSON.stringify(optsGet()));
  store.set(GAME.storeKey, n); store.set(GAME.id + '-res', $('#res').value); store.set(GAME.id + '-touch', $('#touch').value);
  const f = forced; forced = false;
  launch(n, f);
});
name.addEventListener('input', () => { err.textContent = ''; });
$('#lang').addEventListener('click', () => { lang = lang === 'cs' ? 'en' : 'cs'; store.set('landing-lang', lang); render(); });

render();
runChecks();
probe();
</script>
